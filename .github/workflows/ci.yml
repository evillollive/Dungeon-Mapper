name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  browser-journeys:
    name: Browser journeys (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      QA_OUTPUT: ${{ github.workspace }}/.qualification
      QA_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - run: npm run test:browser:run -- --project=${{ matrix.engine }}
      - name: Export, offline and controlled update journeys
        if: ${{ !cancelled() }}
        run: npm run test:ux08:run
      - name: Upload qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.engine }}
          path: ${{ env.QA_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  browser-qualification:
    name: Browser qualification
    needs: browser-journeys
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser engine
        env:
          RESULT: ${{ needs.browser-journeys.result }}
        run: test "$RESULT" = success
